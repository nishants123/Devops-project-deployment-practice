# GitHub Actions workflow to build and push Docker images after tests pass
name: docker build image and push to docker repo

# Defines what triggers this workflow
on:
  workflow_run:
    workflows: ["Python application"]       # triggers only after "Python application" workflow runs
    types:
      - completed                           # fires when the above workflow completes (success or failure)

# Defines all jobs in this workflow
jobs:
  push:                                  # job name (referenced by other workflows)
      if: ${{ github.event.workflow_run.conclusion == 'success' }}  # only runs if the trigger workflow succeeded
      runs-on: ubuntu-latest                # uses the latest Ubuntu virtual machine as the runner

      steps:
      - name: Checkout code                 # step name shown in GitHub Actions UI
        uses: actions/checkout@v3           # pulls the repository code into the runner

      - name: Login to Docker Hub           # step name shown in GitHub Actions UI
        uses: docker/login-action@v3        # uses the official Docker login action
        with:
          username: ${{ secrets.DOCKER_USERNAME }}  # Docker Hub username stored as a GitHub secret
          password: ${{ secrets.DOCKER_PASSWORD }}  # Docker Hub password/token stored as a GitHub secret

      - name: Build Docker Images           # step name shown in GitHub Actions UI
        run: docker compose build           # builds all services defined in docker-compose.yml

      - name: Push Docker Images in docker hub  # step name shown in GitHub Actions UI
        run: docker compose push            # pushes all built images to Docker Hub under the configured repository
